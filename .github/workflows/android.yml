name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix folder name case
        run: |
          [ -d App ] && mv App app
          [ -d app/Src ] && mv app/Src app/src
          [ -d app/src/Main ] && mv app/src/Main app/src/main
          [ -d app/src/main/Res ] && mv app/src/main/Res app/src/main/res
          [ -d app/src/main/res/Xml ] && mv app/src/main/res/Xml app/src/main/res/xml
          [ -d app/src/main/res/Values ] && mv app/src/main/res/Values app/src/main/res/values
          [ -d app/src/main/Java ] && mv app/src/main/Java app/src/main/java
          [ -d app/src/main/java/Com ] && mv app/src/main/java/Com app/src/main/java/com
          [ -d app/src/main/java/com/novelflow/Reader ] && mv app/src/main/java/com/novelflow/Reader app/src/main/java/com/novelflow/reader
          find app -type f
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NovelFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
